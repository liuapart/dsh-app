plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cn.apanoo.dshshell'
    compileSdk 35

    // 站点地址构建时注入，源码/仓库不含域名：
    //   优先环境变量（CI 的 Actions 变量或 Secret），回退 local.properties（gitignored，本机用）
    def lp = new Properties()
    def lpFile = rootProject.file("local.properties")
    if (lpFile.exists()) lpFile.withInputStream { lp.load(it) }
    def dshHost = (System.getenv("BASE_HOST") ?: lp.getProperty("BASE_HOST") ?: "").toString()
    def dshUrl  = (System.getenv("BASE_URL")  ?: lp.getProperty("BASE_URL")  ?: "").toString()

    buildFeatures { buildConfig true }   // AGP 8 默认不再生成 BuildConfig，显式开启

    // 正式签名：从根目录 keystore.properties 读取（该文件含密码，勿提交仓库）
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "cn.apanoo.dshshell"
        minSdk 26          // Android 8.0+：自适应图标/现代 WebView 全覆盖
        targetSdk 34       // 34：保留 statusBarColor 着色语义（35 起 edge-to-edge 强制）
        versionCode 24
        versionName "1.10.0"
        buildConfigField 'String', 'BASE_HOST', "\"$dshHost\""
        buildConfigField 'String', 'BASE_URL', "\"$dshUrl\""
    }

    buildTypes {
        release {
            minifyEnabled false        // 单页壳，混淆收益趋零；需要时再开
            signingConfig signingConfigs.release   // 正式签名：跨机器重建可覆盖升级
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // release 构建跳过 vital lint（单页壳无需；lint 守护进程偶发 Already disposed 崩溃）
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'   // 文档启动前注入 polyfill（WebViewCompat）
}
