# 打 tag（v*）自动构建正式签名 APK 并创建 GitHub Release
# 前提：仓库 Secrets 已配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
name: Build & Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 提供 sdkmanager 并接受许可：AGP 会按需自动补齐 platform-35 / build-tools
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/dsh-shell-release.keystore
          # heredoc 缩进会被 Properties 当续行解析，改用 printf 逐行写入
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/.android/dsh-shell-release.keystore" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          # 自检：4 行齐全且不含缩进污染，否则直接失败给出明确信号
          grep -c '=' keystore.properties | grep -qx '4' || { echo "::error::keystore.properties 写入异常"; exit 1; }
          # 密码自检：在 gradle 之前验证 keystore+密码匹配（否则报错晚且难懂）
          keytool -list -keystore ~/.android/dsh-shell-release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::KEYSTORE_PASSWORD 与 KEYSTORE_BASE64 不匹配"; exit 1; }
          echo "keystore sha256: $(sha256sum ~/.android/dsh-shell-release.keystore | cut -d' ' -f1)"

      - name: Build release APK
        env:
          BASE_HOST: ${{ vars.BASE_HOST || secrets.BASE_HOST }}
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "dsh-shell-${GITHUB_REF_NAME}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-shell-*.apk
          generate_release_notes: true
